[project]
name = "maths-arity"
version = "0.1.0"
dependencies = [
    "fastapi[standard]",
    "SQLAlchemy==2.0.49",
    "PyMySQL==1.1.2",
    "python-dotenv==1.2.2",
    "cloudinary==1.44.1",
    "dropbox==12.0.2",
    "google-api-python-client==2.193.0",
    "pydantic-settings==2.13.1",
    "requests==2.33.1",
    "PyJWT==2.12.1",
    "slowapi==0.1.9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "backend.main:app"
